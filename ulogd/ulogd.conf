# Fedora default: NFLOG group 1 -> text file.
# Configure event sources separately; this file does not change firewall rules.
# Additional examples: /usr/share/doc/ulogd/ulogd.conf and README.Fedora.
[global]
logfile="stdout"
loglevel=5

plugin="@LIBDIR@/ulogd/ulogd_inppkt_NFLOG.so"
plugin="@LIBDIR@/ulogd/ulogd_raw2packet_BASE.so"
plugin="@LIBDIR@/ulogd/ulogd_filter_IFINDEX.so"
plugin="@LIBDIR@/ulogd/ulogd_filter_IP2STR.so"
plugin="@LIBDIR@/ulogd/ulogd_filter_PRINTPKT.so"
plugin="@LIBDIR@/ulogd/ulogd_output_LOGEMU.so"

stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,emu1:LOGEMU

[log1]
group=1

[emu1]
file="/var/log/ulogd/ulogd.log"
sync=1
